<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10264b">

<title>NCERT Study Portal | Orient Classes</title>

<style>
:root{
  --navy:#10264b;
  --blue:#2459c4;
  --blue2:#3478f6;
  --pale:#edf4ff;
  --white:#ffffff;
  --text:#1e293b;
  --muted:#64748b;
  --border:#dbe5f2;
  --green:#16845b;
  --orange:#e67e22;
  --shadow:0 8px 24px rgba(16,38,75,.08);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fc;
  color:var(--text);
}

/* HEADER */

.top-header{
  min-height:70px;
  background:linear-gradient(120deg,#10264b,#2459c4);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 22px;
  gap:15px;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-logo{
  width:45px;
  height:45px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:white;
  color:var(--navy);
  font-size:20px;
  font-weight:900;
}

.brand h1{
  font-size:21px;
  margin-bottom:3px;
}

.brand p{
  font-size:12px;
  opacity:.85;
}

.header-actions{
  display:flex;
  gap:9px;
  align-items:center;
}

.header-btn{
  border:1px solid rgba(255,255,255,.5);
  color:white;
  background:rgba(255,255,255,.12);
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:bold;
  text-decoration:none;
  font-size:13px;
}

.header-btn:hover{
  background:white;
  color:var(--navy);
}

/* MAIN LAYOUT */

.app-layout{
  display:grid;
  grid-template-columns:285px minmax(0,1fr);
  min-height:calc(100vh - 70px);
}

/* SIDEBAR */

.sidebar{
  background:white;
  border-right:1px solid var(--border);
  height:calc(100vh - 70px);
  position:sticky;
  top:70px;
  overflow-y:auto;
  padding:17px 13px 25px;
  z-index:100;
}

.sidebar-heading{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--muted);
  font-weight:bold;
  margin:8px 9px 12px;
}

.sidebar-home{
  width:100%;
  border:none;
  background:var(--pale);
  color:var(--navy);
  padding:13px;
  border-radius:10px;
  text-align:left;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:16px;
}

.class-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.class-button{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:9px;
  background:white;
  cursor:pointer;
  font-size:14px;
  font-weight:bold;
  color:var(--text);
  text-align:left;
}

.class-button:hover,
.class-button.active{
  background:var(--pale);
  border-color:var(--blue);
  color:var(--blue);
}

.class-arrow{
  font-size:12px;
}

.sidebar-sections{
  margin-top:15px;
}

.sidebar-section{
  margin-bottom:8px;
  border:1px solid var(--border);
  border-radius:9px;
  overflow:hidden;
}

.sidebar-section-title{
  background:#f8faff;
  width:100%;
  padding:11px;
  border:none;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  text-align:left;
  font-weight:bold;
  color:var(--navy);
  font-size:13px;
}

.sidebar-section-content{
  padding:7px;
  display:none;
}

.sidebar-section.open .sidebar-section-content{
  display:block;
}

.sidebar-book{
  margin-bottom:8px;
}

.sidebar-book-title{
  color:#475569;
  font-size:12px;
  font-weight:bold;
  padding:8px 6px 5px;
}

.sidebar-chapter{
  display:block;
  width:100%;
  padding:9px 9px 9px 13px;
  margin:3px 0;
  background:white;
  border:1px solid transparent;
  border-radius:7px;
  color:#475569;
  cursor:pointer;
  text-align:left;
  line-height:1.4;
  font-size:12px;
}

.sidebar-chapter:hover,
.sidebar-chapter.active{
  color:var(--blue);
  background:var(--pale);
  border-color:#c8d9ff;
}

/* CONTENT AREA */

.content-area{
  min-width:0;
  padding:24px;
}

.breadcrumb{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
  margin-bottom:18px;
  font-size:12px;
  color:var(--muted);
}

.breadcrumb button{
  background:none;
  border:none;
  color:var(--blue);
  cursor:pointer;
  font-size:12px;
}

.content-inner{
  max-width:1250px;
  margin:0 auto;
}

.page-title{
  font-size:29px;
  color:var(--navy);
  margin-bottom:10px;
  line-height:1.25;
}

.page-subtitle{
  color:var(--muted);
  line-height:1.7;
  font-size:14px;
  margin-bottom:22px;
}

/* HOME HERO */

.hero{
  background:linear-gradient(125deg,#10264b,#2459c4);
  color:white;
  padding:34px;
  border-radius:18px;
  margin-bottom:25px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}

.hero::after{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  border-radius:50%;
  right:-70px;
  top:-70px;
  background:rgba(255,255,255,.08);
}

.hero-label{
  display:inline-block;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.2);
  padding:7px 12px;
  border-radius:30px;
  font-size:12px;
  margin-bottom:17px;
}

.hero h2{
  font-size:32px;
  line-height:1.25;
  margin-bottom:13px;
  max-width:700px;
}

.hero p{
  max-width:700px;
  line-height:1.8;
  font-size:14px;
  color:#e4edff;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:22px;
}

.primary-btn,
.secondary-btn{
  padding:12px 16px;
  border-radius:9px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  font-size:13px;
}

.primary-btn{
  background:white;
  color:var(--navy);
}

.secondary-btn{
  background:rgba(255,255,255,.12);
  color:white;
  border:1px solid rgba(255,255,255,.4);
}

/* GENERAL CARDS */

.section-heading{
  font-size:21px;
  color:var(--navy);
  margin:26px 0 15px;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-bottom:25px;
}

.stat-card{
  background:white;
  padding:20px;
  border-radius:13px;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}

.stat-icon{
  font-size:25px;
  margin-bottom:10px;
}

.stat-card h3{
  font-size:23px;
  color:var(--navy);
  margin-bottom:5px;
}

.stat-card p{
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
}

.class-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
}

.class-card{
  padding:21px;
  background:white;
  border:1px solid var(--border);
  border-radius:13px;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 3px 10px rgba(16,38,75,.03);
}

.class-card:hover{
  transform:translateY(-3px);
  border-color:var(--blue);
  box-shadow:var(--shadow);
}

.class-card-icon{
  width:45px;
  height:45px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--pale);
  font-size:22px;
  margin-bottom:14px;
}

.class-card h3{
  color:var(--navy);
  font-size:18px;
  margin-bottom:7px;
}

.class-card p{
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
}

.card-link{
  display:inline-block;
  margin-top:14px;
  color:var(--blue);
  font-size:12px;
  font-weight:bold;
}

/* SECTION AND CHAPTER LIST */

.section-card{
  background:white;
  border:1px solid var(--border);
  border-radius:13px;
  margin-bottom:17px;
  overflow:hidden;
}

.section-card-header{
  padding:17px 20px;
  background:#f8faff;
  border-bottom:1px solid var(--border);
}

.section-card-header h3{
  color:var(--navy);
  font-size:17px;
  margin-bottom:5px;
}

.section-card-header p{
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
}

.book-group{
  padding:15px 20px;
  border-bottom:1px solid #edf1f7;
}

.book-group:last-child{
  border-bottom:none;
}

.book-title{
  font-size:14px;
  font-weight:bold;
  color:#334155;
  margin-bottom:11px;
}

.chapter-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}

.chapter-card{
  width:100%;
  display:flex;
  align-items:flex-start;
  gap:10px;
  background:white;
  border:1px solid var(--border);
  border-radius:9px;
  padding:12px;
  cursor:pointer;
  text-align:left;
  color:var(--text);
  transition:.15s;
}

.chapter-card:hover{
  background:var(--pale);
  border-color:#9dbaff;
}

.chapter-number{
  min-width:27px;
  height:27px;
  background:#edf4ff;
  color:var(--blue);
  border-radius:7px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:11px;
  font-weight:bold;
}

.chapter-card span:last-child{
  font-size:12px;
  line-height:1.6;
  font-weight:bold;
}

/* CHAPTER VIEWER */

.chapter-toolbar{
  background:white;
  border:1px solid var(--border);
  border-radius:13px;
  padding:15px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}

.resource-btn{
  border:none;
  border-radius:8px;
  padding:12px 15px;
  color:white;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:43px;
}

.resource-btn:hover{
  filter:brightness(.93);
}

.ncert-btn{
  background:#2459c4;
}

.notes-btn{
  background:#16845b;
}

.mcq-btn{
  background:#e67e22;
}

.back-btn{
  background:#475569;
}

.viewer-info{
  background:#eaf2ff;
  color:#234575;
  padding:12px 15px;
  border-radius:9px;
  margin-bottom:13px;
  font-size:12px;
  line-height:1.7;
}

.chapter-frame-wrap{
  width:100%;
  height:calc(100vh - 285px);
  min-height:500px;
  background:white;
  border:1px solid var(--border);
  border-radius:13px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.chapter-frame{
  width:100%;
  height:100%;
  border:none;
  display:block;
  background:white;
}

.viewer-footer{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:14px;
}

.viewer-footer button{
  border:1px solid var(--border);
  background:white;
  color:var(--navy);
  border-radius:8px;
  padding:10px 13px;
  cursor:pointer;
  font-weight:bold;
  font-size:12px;
}

/* SEARCH */

.search-box{
  width:100%;
  max-width:500px;
  display:flex;
  align-items:center;
  gap:8px;
  background:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:11px 13px;
  margin-bottom:20px;
}

.search-box input{
  width:100%;
  border:none;
  outline:none;
  font-size:13px;
  color:var(--text);
  background:transparent;
}

/* EMPTY STATE */

.empty-state{
  background:white;
  padding:30px;
  border:1px dashed #b8c9e2;
  border-radius:12px;
  text-align:center;
  color:var(--muted);
  line-height:1.8;
}

.empty-state h3{
  color:var(--navy);
  margin-bottom:8px;
}

/* FOOTER */

.content-footer{
  max-width:1250px;
  margin:35px auto 0;
  padding:18px 0 5px;
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
  text-align:center;
}

/* MOBILE SIDEBAR */

.mobile-menu-btn{
  display:none;
  border:none;
  background:white;
  color:var(--navy);
  padding:10px 12px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.sidebar-overlay{
  display:none;
}

/* RESPONSIVE */

@media(max-width:1000px){
  .app-layout{
    grid-template-columns:245px minmax(0,1fr);
  }

  .content-area{
    padding:18px;
  }

  .class-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .chapter-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:700px){
  .top-header{
    padding:10px 13px;
    min-height:65px;
  }

  .brand-logo{
    width:39px;
    height:39px;
  }

  .brand h1{
    font-size:17px;
  }

  .brand p{
    font-size:10px;
  }

  .header-actions .header-btn{
    display:none;
  }

  .mobile-menu-btn{
    display:block;
  }

  .app-layout{
    display:block;
  }

  .sidebar{
    position:fixed;
    left:-300px;
    top:65px;
    width:285px;
    height:calc(100vh - 65px);
    transition:left .25s;
    box-shadow:var(--shadow);
  }

  .sidebar.mobile-open{
    left:0;
  }

  .sidebar-overlay.show{
    display:block;
    position:fixed;
    inset:65px 0 0;
    background:rgba(15,23,42,.45);
    z-index:90;
  }

  .content-area{
    padding:15px;
  }

  .hero{
    padding:24px 20px;
  }

  .hero h2{
    font-size:25px;
  }

  .page-title{
    font-size:24px;
  }

  .stats-grid{
    grid-template-columns:1fr;
  }

  .class-grid{
    grid-template-columns:1fr;
  }

  .chapter-frame-wrap{
    height:calc(100vh - 350px);
    min-height:420px;
  }

  .chapter-toolbar{
    padding:10px;
  }

  .resource-btn{
    flex:1 1 100%;
  }
}

@media(min-width:701px){
  .sidebar-overlay{
    display:none!important;
  }
}
</style>
</head>

    <footer class="content-footer">
      <strong>Orient Classes</strong> · NCERT Study Portal<br>

  </main>

</div>

/* =========================================================
   UTILITY FUNCTIONS
========================================================= */

function escapeHTML(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function slugify(text){
  return String(text)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/&/g," and ")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}

function getResourceKey(className,sectionName,bookName,chapterName){
  return [
    className,
    sectionName,
    bookName,
    chapterName
  ].join("|");
}

function getChapterResource(className,sectionName,bookName,chapterName){
  const key = getResourceKey(
    className,
    sectionName,
    bookName,
    chapterName
  );

  return chapterResources[key] || {};
}

function getChapterHTMLPath(className,sectionName,bookName,chapterName){
  const resource = getChapterResource(
    className,
    sectionName,
    bookName,
    chapterName
  );

  /*
    If a specific HTML path is configured above,
    use that path.

    Otherwise the default path will be:
    chapters/chapter-name.html
  */

  return resource.html ||
    ("chapters/" + slugify(chapterName) + ".html");
}

function getAllChaptersCount(){
  let total = 0;

  Object.values(ncertData).forEach(classData => {
    Object.values(classData).forEach(sectionData => {
      Object.values(sectionData).forEach(chapters => {
        total += chapters.length;
      });
    });
  });

  return total;
}

function getClassChapterCount(className){
  let total = 0;
  const classData = ncertData[className] || {};

  Object.values(classData).forEach(sectionData => {
    Object.values(sectionData).forEach(chapters => {
      total += chapters.length;
    });
  });

  return total;
}

function setBreadcrumb(items){
  const container = document.getElementById("breadcrumb");

  container.innerHTML = items.map((item,index) => {
    if(item.action){
      return `
        <button onclick="${item.action}">
          ${escapeHTML(item.label)}
        </button>
        ${index < items.length-1 ? "<span>›</span>" : ""}
      `;
    }

    return `
      <span>${escapeHTML(item.label)}</span>
      ${index < items.length-1 ? "<span>›</span>" : ""}
    `;
  }).join("");
}

function closeMobileSidebar(){
  document.getElementById("sidebar").classList.remove("mobile-open");
  document.getElementById("sidebarOverlay").classList.remove("show");
}

function toggleSidebar(force){
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("sidebarOverlay");

  const shouldOpen =
    typeof force === "boolean"
      ? force
      : !sidebar.classList.contains("mobile-open");

  sidebar.classList.toggle("mobile-open",shouldOpen);
  overlay.classList.toggle("show",shouldOpen);
}

function renderClassList(){
  const container = document.getElementById("classList");

  container.innerHTML = Object.keys(ncertData).map(className => `
    <button
      class="class-button ${currentClass===className ? "active" : ""}"
      onclick="selectClass('${escapeHTML(className)}')">

      <span>📘 ${escapeHTML(className)}</span>
      <span class="class-arrow">›</span>

    </button>
  `).join("");
}

function renderSidebarSections(){
  const container = document.getElementById("sidebarSections");
  const classData = ncertData[currentClass] || {};

  let html = `
    <div class="sidebar-heading">
      ${escapeHTML(currentClass)} Subjects & Chapters
    </div>
  `;

  Object.entries(classData).forEach(([sectionName,books]) => {

    const sectionId = "section-" + slugify(sectionName);

    html += `
      <div class="sidebar-section">
        <button
          class="sidebar-section-title"
          onclick="toggleSection('${sectionId}')">

          <span>${escapeHTML(sectionName)}</span>
          <span>＋</span>

        </button>

        <div class="sidebar-section-content" id="${sectionId}">
    `;

    Object.entries(books).forEach(([bookName,chapters]) => {

      html += `
        <div class="sidebar-book">
          <div class="sidebar-book-title">
            ${escapeHTML(bookName)}
          </div>
      `;

      chapters.forEach((chapter,index) => {

        const active =
          currentPage==="chapter" &&
          currentClass===currentClass &&
          currentChapter===chapter;

        html += `
          <button
            class="sidebar-chapter ${active ? "active" : ""}"
            onclick="openChapterViewer(
              '${escapeHTML(currentClass)}',
              '${escapeHTML(sectionName)}',
              '${escapeHTML(bookName)}',
              '${escapeHTML(chapter)}'
            )">

            ${index+1}. ${escapeHTML(chapter)}

          </button>
        `;
      });

      html += `</div>`;
    });

    html += `
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

function toggleSection(sectionId){
  const section = document.getElementById(sectionId);

  if(!section) return;

  const parent = section.closest(".sidebar-section");

  if(parent){
    parent.classList.toggle("open");
  }
}

      <strong>${escapeHTML(htmlPath)}</strong>
    </div>

    <div class="chapter-frame-wrap">

      <iframe
        id="chapterFrame"
        class="chapter-frame"
        title="${escapeHTML(chapterName)}"
        src="${escapeHTML(htmlPath)}"
        loading="eager">

      </iframe>

    </div>

    <div class="viewer-footer">

      <button onclick="reloadChapter()">
        ↻ Reload Chapter
      </button>

      <button onclick="openChapterInNewTab()">
        ↗ Open HTML in New Tab
      </button>

      <button onclick="goBackToBook()">
        ← Back to Chapter List
      </button>

    </div>
  `;

  renderPage(
    chapterName,
    bookName + " · " + className,
    content,
    [
      {label:"Home",action:"showHome()"},
      {label:className,action:"showClassPage(currentClass)"},
      {label:sectionName},
      {label:chapterName}
    ]
  );

  closeMobileSidebar();

  /*
    Automatically open the relevant subject section
    in the left sidebar.
  */
  setTimeout(() => {
    const chapterButtons = document.querySelectorAll(".sidebar-chapter");

    chapterButtons.forEach(button => {
      if(button.textContent.trim().endsWith(chapterName)){
        const section = button.closest(".sidebar-section");

        if(section){
          section.classList.add("open");
        }
      }
    });
  },50);
}

/* =========================================================
   CHAPTER SEARCH
========================================================= */

function focusSearch(){

  const input = document.getElementById("chapterSearch");

  if(input){
    input.focus();
    input.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });
  }
}

function searchChapters(query){

  searchTerm = query.trim().toLowerCase();

  const resultsContainer = document.getElementById("searchResults");
  const homeGrid = document.getElementById("homeClassGrid");

  if(!resultsContainer) return;

  if(!searchTerm){

    resultsContainer.innerHTML = "";

    if(homeGrid){
      homeGrid.style.display = "grid";
    }

    return;
  }

  if(homeGrid){
    homeGrid.style.display = "none";
  }

  let results = [];

  Object.entries(ncertData).forEach(([className,classData]) => {

    Object.entries(classData).forEach(([sectionName,books]) => {

      Object.entries(books).forEach(([bookName,chapters]) => {

        chapters.forEach(chapter => {

          const searchableText = [
            className,
            sectionName,
            bookName,
            chapter
          ].join(" ").toLowerCase();

          if(searchableText.includes(searchTerm)){

            results.push({
              className,
              sectionName,
              bookName,
              chapter
            });

          }

        });

      });

    });

  });

  if(results.length===0){

    resultsContainer.innerHTML = `
      <div class="empty-state">
        <h3>No Chapters Found</h3>
        Try another class, subject or chapter name.
      </div>
    `;

    return;
  }

  resultsContainer.innerHTML = `

    <h2 class="section-heading">
      Search Results (${results.length})
    </h2>

    <div class="chapter-grid">

      ${results.map(item => `

        <button
          class="chapter-card"
          onclick="openChapterViewer(
            '${escapeHTML(item.className)}',
            '${escapeHTML(item.sectionName)}',
            '${escapeHTML(item.bookName)}',
            '${escapeHTML(item.chapter)}'
          )">

          <span class="chapter-number">📖</span>

          <span>
            <strong>${escapeHTML(item.chapter)}</strong>
            <br>
            <small>
              ${escapeHTML(item.className)}
              · ${escapeHTML(item.sectionName)}
            </small>
          </span>

        </button>

      `).join("")}

    </div>
  `;
}
