<title>NCERT Class 6–12 Chapter Index | BPSC Study Portal</title>

<style>
:root{
  --navy:#10264b;
  --blue:#2459c4;
  --blue2:#3478f6;
  --pale:#edf4ff;
  --line:#e1e8f2;
  --ink:#202c40;
  --muted:#69788e;
  --gold:#f5bd4f;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f6fb;
  color:var(--ink);
  font-family:Segoe UI,Arial,sans-serif;
  line-height:1.5;
}

/* HEADER */

header{
  padding:23px clamp(16px,3vw,36px);
  color:#fff;
  background:linear-gradient(120deg,#0b1d3a,#1c4c91,#2563eb);
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.logo{
  width:49px;
  height:49px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:#ffffff20;
  border:1px solid #ffffff38;
  font-size:25px;
}

header h1{
  margin:0;
  font-size:clamp(22px,3vw,32px);
}

header p{
  margin:5px 0 0;
  color:#dbeafe;
  font-size:13px;
}

/* MAIN */

.container{
  max-width:1250px;
  margin:24px auto;
  padding:0 18px;
}

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  background:#fff;
  padding:15px;
  border:1px solid var(--line);
  border-radius:13px;
  margin-bottom:20px;
}

.search{
  flex:1;
  min-width:220px;
  padding:12px 14px;
  border:1px solid #d8e2f0;
  border-radius:9px;
  font-size:14px;
  outline:none;
}

.search:focus{
  border-color:var(--blue2);
  box-shadow:0 0 0 3px #3478f620;
}

.toolbar-buttons{
  display:flex;
  gap:8px;
}

.tool-btn{
  padding:10px 13px;
  border:1px solid #d8e2f0;
  border-radius:8px;
  background:#fff;
  color:var(--navy);
  font-weight:700;
  cursor:pointer;
}

.tool-btn:hover{
  background:var(--pale);
}

/* CLASS SECTION */

.class-section{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  margin-bottom:20px;
  box-shadow:0 5px 20px #10264b08;
}

.class-header{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:17px 20px;
  border:0;
  background:linear-gradient(100deg,#10264b,#2459c4);
  color:#fff;
  cursor:pointer;
  text-align:left;
}

.class-header h2{
  margin:0;
  font-size:20px;
}

.class-header span{
  font-size:13px;
  color:#dbeafe;
}

.class-header .arrow{
  font-size:22px;
  transition:transform .2s;
}

.class-header[aria-expanded="true"] .arrow{
  transform:rotate(180deg);
}

.class-content{
  padding:18px;
  display:none;
}

.class-content.open{
  display:block;
}

/* SUBJECT */

.subject{
  border:1px solid var(--line);
  border-radius:10px;
  margin-bottom:14px;
  overflow:hidden;
}

.subject:last-child{
  margin-bottom:0;
}

.subject-header{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 15px;
  border:0;
  background:#edf4ff;
  color:#173d7b;
  font-size:15px;
  font-weight:800;
  text-align:left;
  cursor:pointer;
}

.subject-header:hover{
  background:#e0ecff;
}

.subject-header .arrow{
  margin-left:auto;
  transition:transform .2s;
}

.subject-header[aria-expanded="true"] .arrow{
  transform:rotate(180deg);
}

.subject-content{
  display:none;
  padding:14px;
  background:#fff;
}

.subject-content.open{
  display:block;
}

/* DIVISION */

.division{
  margin-bottom:14px;
}

.division:last-child{
  margin-bottom:0;
}

.division-title{
  margin:0 0 9px;
  color:#34445d;
  font-size:13px;
  font-weight:800;
}

/* CHAPTER GRID */

.chapter-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.chapter{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:10px 11px;
  background:#fff;
  border:1px solid #e5eaf2;
  border-radius:8px;
  color:#34445d;
  font-size:13px;
}

.chapter:hover{
  background:#fffaf0;
  border-color:#efcf88;
}

.chapter-number{
  flex:0 0 25px;
  height:25px;
  display:grid;
  place-items:center;
  background:#eaf1ff;
  color:#2459c4;
  border-radius:6px;
  font-size:10px;
  font-weight:900;
}

.chapter-name{
  min-width:0;
  overflow-wrap:anywhere;
}

.part-title{
  margin:4px 0 12px;
  padding:10px 12px;
  background:#fff7e6;
  border-left:4px solid var(--gold);
  border-radius:5px;
  color:#75500b;
  font-size:14px;
  font-weight:800;
}

.empty{
  display:none;
  text-align:center;
  padding:35px 15px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  color:var(--muted);
}

footer{
  text-align:center;
  color:#8a96a7;
  padding:0 15px 25px;
  font-size:12px;
}

@media(max-width:650px){
  .container{
    padding:0 10px;
    margin:14px auto;
  }

  .chapter-list{
    grid-template-columns:1fr;
  }

  .class-header{
    padding:15px;
  }

  .class-header h2{
    font-size:18px;
  }

  .class-content{
    padding:11px;
  }

  .toolbar{
    padding:11px;
  }

  .toolbar-buttons{
    width:100%;
  }

  .tool-btn{
    flex:1;
  }
}

@media(prefers-reduced-motion:reduce){
  *,
  *:before,
  *:after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

/* BUILD INDEX */

const container = document.getElementById("indexContainer");

function createElement(tag,className,text){
  const el = document.createElement(tag);
  if(className) el.className = className;
  if(text !== undefined) el.textContent = text;
  return el;
}

function createToggle(title,className,contentClass,icon=""){

  const button = createElement("button",className);

  button.type = "button";
  button.setAttribute("aria-expanded","false");

  const label = createElement("span","",title);
  const arrow = createElement("span","arrow","⌄");

  button.append(label,arrow);

  const content = createElement("div",contentClass);

  button.addEventListener("click",()=>{

    const open = !content.classList.contains("open");

    content.classList.toggle("open",open);

    button.setAttribute("aria-expanded",String(open));

  });

  return {button,content};
}

function buildIndex(){

  ncertData.forEach(classData=>{

    const section = createElement("section","class-section");

    section.dataset.search = classData.className.toLowerCase();

    const header = createElement("button","class-header");
    header.type = "button";
    header.setAttribute("aria-expanded","false");

    const left = createElement("div");
    const title = createElement("h2","",classData.className);

    const summary = createElement(
      "span",
      "",
      `${classData.subjects.length} subject categories`
    );

    left.append(title,summary);

    const arrow = createElement("span","arrow","⌄");

    header.append(left,arrow);

    const content = createElement("div","class-content");

    header.addEventListener("click",()=>{

      const open = !content.classList.contains("open");

      content.classList.toggle("open",open);

      header.setAttribute("aria-expanded",String(open));

    });

    classData.subjects.forEach(subjectData=>{

      const subject = createElement("section","subject");

      subject.dataset.search = subjectData.name.toLowerCase();

      const subjectHeader = createElement("button","subject-header");

      subjectHeader.type = "button";
      subjectHeader.setAttribute("aria-expanded","false");

      const subjectIcon = createElement(
        "span",
        "",
        subjectData.name === "Science" ? "🔬" :
        subjectData.name === "History" ? "🏛️" :
        subjectData.name === "Geography" ? "🌍" :
        subjectData.name === "Political Science" ? "⚖️" :
        subjectData.name === "Civics" ? "🏛️" :
        subjectData.name === "Economics" ? "📈" :
        "📚"
      );

      const subjectTitle = createElement("span","",subjectData.name);
      const subjectArrow = createElement("span","arrow","⌄");

      subjectHeader.append(subjectIcon,subjectTitle,subjectArrow);

      const subjectContent = createElement("div","subject-content");

      subjectHeader.addEventListener("click",()=>{

        const open = !subjectContent.classList.contains("open");

        subjectContent.classList.toggle("open",open);

        subjectHeader.setAttribute("aria-expanded",String(open));

      });

      subjectData.divisions.forEach(division=>{

        const divisionBox = createElement("div","division");

        const divisionTitle = createElement(
          "h3",
          "division-title",
          division.name
        );

        const chapterList = createElement("div","chapter-list");

        division.chapters.forEach((chapter,index)=>{

          const chapterItem = createElement("div","chapter");

          chapterItem.dataset.search = chapter.toLowerCase();

          const number = createElement(
            "span",
            "chapter-number",
            String(index+1).padStart(2,"0")
          );

          const name = createElement("span","chapter-name",chapter);

          chapterItem.append(number,name);

          chapterList.appendChild(chapterItem);

        });

        divisionBox.append(divisionTitle,chapterList);

        subjectContent.appendChild(divisionBox);

      });

      subject.append(subjectHeader,subjectContent);

      content.appendChild(subject);

    });

    section.append(header,content);

    container.appendChild(section);

  });

}

buildIndex();


/* SEARCH */

document.getElementById("searchInput").addEventListener("input",function(){

  const query = this.value.trim().toLowerCase();

  let visibleCount = 0;

  document.querySelectorAll(".class-section").forEach(section=>{

    let classMatch = section.dataset.search.includes(query);

    let sectionHasMatch = false;

    section.querySelectorAll(".subject").forEach(subject=>{

      const subjectMatch = subject.dataset.search.includes(query);

      let subjectHasMatch = false;

      subject.querySelectorAll(".chapter").forEach(chapter=>{

        const chapterMatch = chapter.dataset.search.includes(query);

        const show = !query || classMatch || subjectMatch || chapterMatch;

        chapter.style.display = show ? "flex" : "none";

        if(show) subjectHasMatch = true;

      });

      const showSubject =
        !query || classMatch || subjectMatch || subjectHasMatch;

      subject.style.display = showSubject ? "block" : "none";

      if(showSubject) sectionHasMatch = true;

      if(query && showSubject){

        const subjectContent = subject.querySelector(".subject-content");
        const subjectHeader = subject.querySelector(".subject-header");

        subjectContent.classList.add("open");
        subjectHeader.setAttribute("aria-expanded","true");

      }

    });

    const showSection = !query || classMatch || sectionHasMatch;

    section.style.display = showSection ? "block" : "none";

    if(showSection) visibleCount++;

    if(query && showSection){

      const content = section.querySelector(".class-content");
      const header = section.querySelector(".class-header");

      content.classList.add("open");
      header.setAttribute("aria-expanded","true");

    }

  });

  document.getElementById("emptyMessage").style.display =
    visibleCount === 0 ? "block" : "none";

});


/* EXPAND ALL */

function expandAll(){

  document.querySelectorAll(".class-content,.subject-content").forEach(el=>{
    el.classList.add("open");
  });

  document.querySelectorAll(".class-header,.subject-header").forEach(el=>{
    el.setAttribute("aria-expanded","true");
  });

}


/* COLLAPSE ALL */

function collapseAll(){

  document.querySelectorAll(".class-content,.subject-content").forEach(el=>{
    el.classList.remove("open");
  });

  document.querySelectorAll(".class-header,.subject-header").forEach(el=>{
    el.setAttribute("aria-expanded","false");
  });

}

</script>
