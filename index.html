
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPSC File Explorer</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101318;
  color:#e8eaf0;
}
header{
  height:65px;
  background:#191e27;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #303744;
}
.brand{font-size:20px;font-weight:bold}
.header-right{display:flex;gap:10px}
button{
  border:0;
  border-radius:7px;
  padding:10px 14px;
  background:#2879dc;
  color:white;
  cursor:pointer;
}
button:hover{background:#1765bf}
.search{
  width:100%;
  padding:12px;
  background:#202630;
  color:white;
  border:1px solid #394353;
  border-radius:7px;
  outline:none;
}
.app{
  display:flex;
  height:calc(100vh - 65px);
}
.sidebar{
  width:310px;
  min-width:250px;
  background:#171c24;
  border-right:1px solid #303744;
  display:flex;
  flex-direction:column;
}
.side-top{padding:15px}
.stats{
  color:#9ca8ba;
  font-size:12px;
  margin-top:12px;
}
.tree{
  overflow:auto;
  padding:5px 10px 20px;
  flex:1;
}
.node{
  margin:2px 0;
}
.node-row{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 8px;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
  word-break:break-word;
}
.node-row:hover{background:#293443}
.node-row.active{background:#214b7b}
.children{
  margin-left:16px;
  padding-left:9px;
  border-left:1px solid #3a4554;
}
.hidden{display:none!important}
.icon{width:19px;flex-shrink:0}
.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}
.toolbar{
  min-height:52px;
  background:#171c24;
  border-bottom:1px solid #303744;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 15px;
  gap:10px;
}
.path{
  color:#a9b6c9;
  font-size:13px;
  overflow-wrap:anywhere;
}
.viewer{
  flex:1;
  overflow:auto;
  background:#fff;
  color:#222;
  position:relative;
}
.viewer iframe{
  width:100%;
  height:100%;
  border:0;
  background:white;
}
.viewer pre{
  margin:0;
  padding:20px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:14px;
  line-height:1.6;
  background:#fff;
  color:#222;
}
.welcome{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  color:#526174;
}
.welcome h2{color:#24364c}
.status{
  font-size:12px;
  color:#9ca8ba;
  padding:10px 15px;
  border-top:1px solid #303744;
}
.error{color:#d33}
.mobile-menu{display:none}
@media(max-width:700px){
  .sidebar{
    position:absolute;
    top:65px;
    bottom:0;
    left:0;
    z-index:10;
    width:82%;
    max-width:320px;
    box-shadow:5px 0 20px #0008;
  }
  .sidebar.closed{display:none}
  .mobile-menu{display:block}
  .brand{font-size:16px}
  .toolbar{align-items:flex-start;flex-direction:column}
}
</style>
</head>

<body>

<header>
  <div style="display:flex;align-items:center;gap:12px">
    <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
    <div class="brand">📚 BPSC Explorer</div>
  </div>

  <div class="header-right">
    <button onclick="loadRepository()">↻ Refresh</button>
    <button onclick="window.open('https://github.com/premji321/public_html','_blank')">
      GitHub ↗
    </button>
  </div>
</header>

<div class="app">

  <!-- LEFT PANEL -->
  <aside class="sidebar" id="sidebar">

    <div class="side-top">
      <input
        class="search"
        id="search"
        placeholder="🔍 Search folders and files..."
        oninput="searchTree(this.value)"
      >

      <div class="stats" id="stats">
        Connecting to GitHub...
      </div>
    </div>

    <div class="tree" id="tree">
      Loading repository...
    </div>

    <div class="status" id="status">
      Initializing...
    </div>

  </aside>

  <!-- RIGHT PANEL -->
  <main class="main">

    <div class="toolbar">
      <div class="path" id="filePath">BPSC / Home</div>

      <div>
        <button onclick="openOriginal()" style="background:#444f60">
          Open Original ↗
        </button>
      </div>
    </div>

    <div class="viewer" id="viewer">

      <div class="welcome">
        <h2>📚 BPSC Study Explorer</h2>
        <p>Select any folder or file from the left panel.</p>
        <p>Your selected content will appear here.</p>
      </div>

    </div>

  </main>

</div>

<script>

// ======================================
// GITHUB CONFIGURATION
// ======================================

const OWNER = "premji321";
const REPO = "public_html";
const BRANCH = "main";

// IMPORTANT: BPSC folder name is lowercase
const ROOT_FOLDER = "bpsc";

const API_URL =
`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;

const RAW_URL =
`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;

let repositoryTree = {};
let selectedFile = null;
let allFiles = [];
let fileCount = 0;
let folderCount = 0;


// ======================================
// LOAD GITHUB REPOSITORY
// ======================================

async function loadRepository(){

  const treeElement = document.getElementById("tree");
  const status = document.getElementById("status");

  treeElement.innerHTML = "Loading GitHub files...";
  status.textContent = "Connecting to GitHub API...";

  try{

    const response = await fetch(API_URL);

    if(!response.ok){
      throw new Error("GitHub API Error: " + response.status);
    }

    const data = await response.json();

    if(data.truncated){
      throw new Error(
        "GitHub returned an incomplete file tree. Please contact support."
      );
    }

    repositoryTree = {
      name: ROOT_FOLDER,
      type: "dir",
      path: ROOT_FOLDER,
      children: {}
    };

    allFiles = [];
    fileCount = 0;
    folderCount = 0;

    // Filter only BPSC directory
    const items = data.tree.filter(item =>
      item.path.startsWith(ROOT_FOLDER + "/")
    );

    if(items.length === 0){
      throw new Error("BPSC folder not found in repository.");
    }

    items.sort((a,b)=>a.path.localeCompare(b.path));

    items.forEach(item=>{

      const parts = item.path.split("/");

      if(parts[0] !== ROOT_FOLDER) return;

      let current = repositoryTree;

      for(let i=1;i<parts.length;i++){

        const name = parts[i];
        const isLast = i === parts.length-1;

        if(!current.children[name]){

          current.children[name] = {
            name:name,
            path:parts.slice(0,i+1).join("/"),
            type:isLast && item.type === "blob"
              ? "file"
              : "dir",
            children:{}
          };

          if(!isLast || item.type !== "blob"){
            folderCount++;
          }

        }

        current = current.children[name];

        if(isLast && item.type === "blob"){
          current.type = "file";
          current.sha = item.sha;
          current.size = item.size;
          current.url = item.url;
          current.children = undefined;
          allFiles.push(current);
          fileCount++;
        }
      }

    });

    renderTree(repositoryTree,treeElement);

    document.getElementById("stats").textContent =
      `${folderCount} folders • ${fileCount} files`;

    status.textContent =
      "✓ Connected to GitHub • Branch: " + BRANCH;

  }
  catch(error){

    treeElement.innerHTML =
      `<p class="error">${escapeHTML(error.message)}</p>`;

    status.textContent = "Connection failed";

  }

}


// ======================================
// DISPLAY HIERARCHICAL TREE
// ======================================

function renderTree(node,container){

  container.innerHTML = "";

  const root = document.createElement("div");

  root.appendChild(createNode(node,true));

  container.appendChild(root);

}


function createNode(node,isRoot=false){

  const wrapper = document.createElement("div");
  wrapper.className = "node";

  const row = document.createElement("div");
  row.className = "node-row";

  const isFolder = node.type === "dir";

  const icon = document.createElement("span");
  icon.className = "icon";
  icon.textContent = isFolder ? "📁" : getIcon(node.name);

  const name = document.createElement("span");
  name.textContent = node.name;

  const arrow = document.createElement("span");
  arrow.textContent = isFolder ? "▸" : "";

  row.append(arrow,icon,name);

  wrapper.appendChild(row);

  if(isFolder){

    const children = document.createElement("div");
    children.className = "children hidden";

    const childNodes = Object.values(node.children || {})
      .sort((a,b)=>{

        if(a.type !== b.type){
          return a.type === "dir" ? -1 : 1;
        }

        return a.name.localeCompare(b.name);
      });

    childNodes.forEach(child=>{
      children.appendChild(createNode(child));
    });

    wrapper.appendChild(children);

    row.onclick = ()=>{

      const closed = children.classList.toggle("hidden");

      arrow.textContent = closed ? "▸" : "▾";
      icon.textContent = closed ? "📁" : "📂";

      if(isRoot && !closed){
        row.classList.add("active");
      }
    };

    if(isRoot){
      children.classList.remove("hidden");
      arrow.textContent = "▾";
      icon.textContent = "📂";
    }

  }else{

    row.onclick = ()=>{

      document.querySelectorAll(".node-row.active")
        .forEach(el=>el.classList.remove("active"));

      row.classList.add("active");

      openFile(node);
    };

  }

  return wrapper;

}


// ======================================
// FILE ICONS
// ======================================

function getIcon(name){

  const ext = name.split(".").pop().toLowerCase();

  const icons = {
    html:"🌐",
    htm:"🌐",
    pdf:"📕",
    txt:"📄",
    md:"📝",
    json:"⚙️",
    js:"📜",
    css:"🎨",
    png:"🖼️",
    jpg:"🖼️",
    jpeg:"🖼️",
    webp:"🖼️",
    svg:"🖼️"
  };

  return icons[ext] || "📄";

}


// ======================================
// OPEN SELECTED FILE
// ======================================

async function openFile(file){

  selectedFile = file;

  document.getElementById("filePath").textContent =
    file.path;

  const viewer = document.getElementById("viewer");

  const ext = file.name.split(".").pop().toLowerCase();

  const url = RAW_URL +
    file.path.split("/").map(encodeURIComponent).join("/");

  viewer.innerHTML =
    `<div class="welcome"><h2>Loading...</h2></div>`;

  // PDF
  if(ext === "pdf"){

    viewer.innerHTML =
      `<iframe src="${url}#toolbar=1"></iframe>`;

    return;
  }

  // Images
  if(["png","jpg","jpeg","gif","webp","svg"].includes(ext)){

    const img = document.createElement("img");

    img.src = url;
    img.style.cssText =
      "max-width:100%;max-height:100%;display:block;margin:auto";

    viewer.innerHTML = "";
    viewer.appendChild(img);

    return;
  }

  try{

    const response = await fetch(url);

    if(!response.ok){
      throw new Error("Unable to load file");
    }

    const content = await response.text();

    // HTML PREVIEW
    if(ext === "html" || ext === "htm"){

      const frame = document.createElement("iframe");

      // Isolated preview of repository HTML
      frame.setAttribute("sandbox","allow-scripts allow-forms");
      frame.srcdoc = content;

      viewer.innerHTML = "";
      viewer.appendChild(frame);

    }

    // TEXT AND SOURCE FILES
    else{

      const pre = document.createElement("pre");

      pre.textContent = content;

      viewer.innerHTML = "";
      viewer.appendChild(pre);

    }

  }
  catch(error){

    viewer.innerHTML =
      `<div class="welcome error">${escapeHTML(error.message)}</div>`;

  }

}


// ======================================
// OPEN ORIGINAL FILE
// ======================================

function openOriginal(){

  if(!selectedFile) return;

  const url =
    `https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/${selectedFile.path}`;

  window.open(url,"_blank");

}


// ======================================
// SEARCH FILES AND FOLDERS
// ======================================

function searchTree(query){

  query = query.toLowerCase().trim();

  const nodes = document.querySelectorAll(".node");

  nodes.forEach(node=>{
    node.classList.remove("search-hide");
  });

  if(!query) return;

  nodes.forEach(node=>{

    const row = node.querySelector(":scope > .node-row");

    if(!row) return;

    const name = row.innerText.toLowerCase();

    if(!name.includes(query)){

      const descendants =
        node.querySelectorAll(".node-row");

      const hasMatch =
        [...descendants].some(el=>
          el.innerText.toLowerCase().includes(query)
        );

      if(!hasMatch){
        node.classList.add("search-hide");
      }

    }

  });

  document.querySelectorAll(".node.search-hide")
    .forEach(node=>node.style.display="none");

  document.querySelectorAll(".node:not(.search-hide)")
    .forEach(node=>node.style.display="block");

  // Ensure parent folders are visible
  document.querySelectorAll(".node").forEach(node=>{

    const child = node.querySelector(".node-row");

    if(child && child.innerText.toLowerCase().includes(query)){
      let parent = node.parentElement;

      while(parent){

        if(parent.classList.contains("node")){
          parent.style.display="block";

          const children =
            parent.querySelector(":scope > .children");

          if(children) children.classList.remove("hidden");
        }

        parent = parent.parentElement;
      }

    }

  });

}


// ======================================
// UTILITY FUNCTIONS
// ======================================

function escapeHTML(text){

  return String(text).replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));

}


function toggleSidebar(){

  document.getElementById("sidebar")
    .classList.toggle("closed");

}


// ======================================
// START APPLICATION
// ======================================

loadRepository();

</script>

</body>
</html>
