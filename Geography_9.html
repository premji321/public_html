        body 
        {

            margin: 0;

        .header {
            background: linear-gradient(90deg, #1E3C72, #2A5298);
            color: white;
            text-align: center;
            font-size: 32px;
            padding: 20px;
            font-weight: bold;
            letter-spacing: 2px;

        .navbar {
            background: #FFD700;
            display: flex;
            justify-content: center;
            padding: 15px 0;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }
        .dropdown {
            position: relative;
            
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            
            position: absolute;
            background-color: lightcyan;
            min-width: 250px;
            box-shadow: 3px 3px 7px rgba(0, 0, 0, 0.2);
            padding: 10px;
            z-index: 1;
            border-radius: 10px;
        }
        .dropdown:hover .dropdown-content {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .dropdown-content div {
            background: none;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .dropdown-content div:hover {
            background: blue;
            color: white;
        }
        .navbar button {
            background: white;
            border: none;
            padding: 12px 25px;
            margin: 0 15px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 25px;
            transition: 0.3s;
            box-shadow: 3px 3px 7px rgba(0, 0, 0, 0.2);
        }
        .navbar button:hover {
            background: #FFA500;
            color: white;
            transform: scale(1.1);
        }
        .content {
            display: flex;
            min-height: 600px;
        }
        .sidebar {
            width: 20%;
            background: #FDEDEC;
            padding: 20px;
        }
        
        .sidebar ol li{
            list-style: none;
            
        }
        
        .sidebar ol li a{
            display: block;
            text-decoration: none;
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: none;
            background: #34495e;
            color: white;
            cursor: pointer;
            text-align: left;
        }
        .sidebar ol li a:hover {
            background: #1abc9c;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
        }
        .main-content {
            flex-grow: 1;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            margin: 20px;
        }
        .right-sidebar {
            width: 10%;
            background: linear-gradient(180deg, #2A5298, #1E3C72);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        }
        .right-sidebar button {
            background: #FF69B4;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 20px;
            transition: 0.3s;
            box-shadow: 3px 3px 7px rgba(0, 0, 0, 0.2);
        }
        .right-sidebar button:hover {
            background: #FF1493;
            transform: scale(1.1);
        }
        .subject-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin-top: 10px;
        }
        .subject-button {
            decoration : none;
            box-shadow: 3px 3px 10px lightblue;
            background: white;
            color: darkslategray;
            border: none;
            padding: 18px 22px;
            border-radius: 15px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            
        }
        .subject-button:hover {
            background: orange;
        }
